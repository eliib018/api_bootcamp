apiVersion: apps/v1
kind: Deployment
metadata:
  name: seq
  namespace: api-bootcamp
spec:
  replicas: 1
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: seq

  template:
    metadata:
      labels:
        app: seq

    spec:
      containers:
        - name: seq
          image: datalust/seq:latest

          env:
            - name: ACCEPT_EULA
              value: "Y"

            - name: SEQ_FIRSTRUN_ADMINUSERNAME
              value: "admin"

            - name: SEQ_FIRSTRUN_ADMINPASSWORD
              value: "123456"

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          volumeMounts:
            - name: seq-storage
              mountPath: /data
              subPath: seq

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

      volumes:
        - name: seq-storage
          persistentVolumeClaim:
            claimName: seq-pvc