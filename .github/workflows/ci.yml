name: CI-CD ApiBootcamp

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, validate and publish
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        shell: bash
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore api_bootcamp.slnx

      - name: Build
        run: dotnet build api_bootcamp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet build api_bootcamp.slnx --configuration Release --no-build --verbosity normal

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        run: |
          helm lint helm/api-bootcamp --set-string postgres.password=ci-validation
          helm template api-bootcamp helm/api-bootcamp \
            --namespace api-bootcamp \
            --set-string postgres.password=ci-validation \
            > /dev/null

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-bootcamp:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/api-bootcamp:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd:
    name: Deploy to Minikube
    needs: ci

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Minikube
        shell: powershell
        run: |
          minikube -p api-bootcamp status
          kubectl config use-context api-bootcamp
          kubectl cluster-info

      - name: Create namespace
        shell: powershell
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Create PostgreSQL secret
        shell: powershell
        run: |
          kubectl create secret generic postgres-secret `
            --namespace api-bootcamp `
            --from-literal=POSTGRES_DB=api_bootcamp `
            --from-literal=POSTGRES_USER=postgres `
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" `
            --dry-run=client `
            -o yaml | kubectl apply -f -

      - name: Deploy PostgreSQL
        shell: powershell
        run: |
          kubectl apply -f k8s/postgres-pvc.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/postgres-service.yaml

          kubectl rollout status deployment/postgres `
            --namespace api-bootcamp `
            --timeout=120s

      - name: Deploy Seq
        shell: powershell
        run: |
          kubectl apply -f k8s/seq-pvc.yaml
          kubectl apply -f k8s/seq-deployment.yaml
          kubectl apply -f k8s/seq-service.yaml

          kubectl rollout status deployment/seq `
            --namespace api-bootcamp `
            --timeout=120s

      - name: Deploy ApiBootcamp with Helm
        shell: powershell
        run: |
          helm upgrade --install api-bootcamp ./helm/api-bootcamp `
            --namespace api-bootcamp `
            --set image.repository=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/api-bootcamp `
            --set image.tag=${{ needs.ci.outputs.image_tag }} `
            --set image.pullPolicy=Always `
            --set-string postgres.password="${{ secrets.POSTGRES_PASSWORD }}" `
            --wait `
            --timeout 3m

      - name: Verify deployment
        shell: powershell
        run: |
          kubectl rollout status deployment/api-bootcamp `
            --namespace api-bootcamp `
            --timeout=120s

          kubectl get pods `
            --namespace api-bootcamp

          kubectl get services `
            --namespace api-bootcamp