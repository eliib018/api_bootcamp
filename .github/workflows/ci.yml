name: CI ApiBootcamp

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validar solución
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore api_bootcamp.slnx

      - name: Build
        run: >
          dotnet build api_bootcamp.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test api_bootcamp.slnx
          --configuration Release
          --no-build

      - name: Configurar Helm
        uses: azure/setup-helm@v4

      - name: Validar Helm Dev
        run: |
          helm lint chart \
            -f chart/values-dev.yaml \
            --set-string postgres.password=ci-validation \
            --set-string seq.adminPassword=ci-validation

          helm template api-bootcamp chart \
            -f chart/values-dev.yaml \
            --namespace api-bootcamp \
            --set-string postgres.password=ci-validation \
            --set-string seq.adminPassword=ci-validation \
            > /dev/null

      - name: Validar Helm QA
        run: |
          helm lint chart \
            -f chart/values-qa.yaml \
            --set-string postgres.password=ci-validation \
            --set-string seq.adminPassword=ci-validation

          helm template api-bootcamp chart \
            -f chart/values-qa.yaml \
            --namespace api-bootcamp \
            --set-string postgres.password=ci-validation \
            --set-string seq.adminPassword=ci-validation \
            > /dev/null

  package:
    name: Construir y publicar imagen
    needs: validation

    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir tag de imagen
        id: meta
        shell: bash
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max
